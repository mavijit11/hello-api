<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5ff">
  <title>Avijit — Personal Page</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #24203a;
      --muted: #6d6682;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 15%, rgba(255, 190, 230, .72), transparent 35%),
        radial-gradient(ellipse at 90% 18%, rgba(173, 220, 255, .78), transparent 36%),
        radial-gradient(ellipse at 80% 90%, rgba(205, 190, 255, .75), transparent 38%),
        radial-gradient(ellipse at 15% 85%, rgba(185, 255, 232, .6), transparent 34%),
        #f8f5ff;
    }

    .card {
      position: relative;
      isolation: isolate;
      width: min(100%, 720px);
      padding: clamp(32px, 7vw, 64px);
      border: 1px solid rgba(255, 255, 255, .82);
      border-radius: 30px;
      background: rgba(255, 255, 255, .58);
      box-shadow: 0 24px 80px rgba(94, 75, 140, .14),
                  inset 0 1px 0 rgba(255, 255, 255, .9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -1px;
      z-index: -1;
      border-radius: inherit;
      padding: 1.5px;
      background: linear-gradient(125deg, #ffb8e5, #b9d9ff, #c9baff, #a9f4df, #ffe2b6);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 24px;
      color: #71658f;
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .sparkle {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff9fd6, #a7bfff, #8cebd5);
      box-shadow: 0 0 16px rgba(174, 153, 255, .8);
    }

    h1 {
      margin: 0;
      font-size: clamp(3.3rem, 11vw, 6.4rem);
      line-height: .98;
      letter-spacing: -.075em;
      font-weight: 800;
      background: linear-gradient(100deg, #a34f9d 0%, #6c70c9 38%, #3c9db5 70%, #65a58e 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .education {
      margin: 18px 0 32px;
      color: #625b79;
      font-size: clamp(1rem, 3vw, 1.2rem);
      font-weight: 500;
    }

    .rule {
      width: 58px;
      height: 4px;
      margin-bottom: 25px;
      border-radius: 999px;
      background: linear-gradient(90deg, #f5a8d7, #a9c5ff, #9ce7d5);
    }

    .description {
      max-width: 560px;
      margin: 0;
      font-size: clamp(1.05rem, 3vw, 1.25rem);
      line-height: 1.75;
      color: #3e3854;
    }

    .date {
      display: inline-block;
      margin-top: 38px;
      padding: 10px 15px;
      border: 1px solid rgba(183, 166, 220, .35);
      border-radius: 999px;
      background: rgba(255, 255, 255, .5);
      color: var(--muted);
      font-size: .9rem;
    }

    @media (max-width: 420px) {
      body { padding: 16px; }
      .card { border-radius: 24px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .card { animation: float-in .7s ease-out both; }
      @keyframes float-in {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow"><span class="sparkle" aria-hidden="true"></span> A little about me</p>
    <h1>Avijit</h1>
    <p class="education">MSc student, National College of Ireland</p>
    <div class="rule" aria-hidden="true"></div>
    <p class="description">
      I care about how data analytics can help businesses make smarter,
      evidence-based decisions and uncover growth opportunities in the
      B2B exhibition industry.
    </p>
    <p class="date">Today · <time id="today"></time></p>
  </main>

  <script>
    const today = new Date();
    document.getElementById("today").textContent = today.toLocaleDateString("en-IE", {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    });
  </script>
</body>
</html>
